name: CI Build

on:
  workflow_dispatch:

jobs:
  ci_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true
      - name: Set Env
        run: |
          echo MOD_ID="$(basename "$(pwd)")" >> $GITHUB_ENV
          test -f LICENSE.txt && test ! -f src/LICENSE.txt && cp LICENSE.txt src/LICENSE.txt
      - name: Build Module
        id: mod
        uses: OOM-WG/ROOT-Modules-Auto-Builder@v1
        with:
          input-dir: ${{ github.workspace }}/..
          input-id: ${{ env.MOD_ID }}
          output-dir: ${{ github.workspace }}/output
      - name: Upload Instpkg
        uses: actions/upload-artifact@v4
        with:
          name: ci
          path: ${{ github.workspace }}/output/${{ env.MOD_ID }}/instpkg.zip